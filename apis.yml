aid: gorgie
name: GORGIE
description: >-
  GORGIE is a direct-to-consumer beverage brand making a sparkling, zero-sugar
  energy drink with functional benefits from green tea, natural flavors, Biotin,
  B Vitamins, and L-Theanine — only 5 calories, no preservatives. Built by a
  women-led team on a mission to make wellness fun, GORGIE sells its variety of
  flavors through a Shopify-powered online store at getgorgie.com and on retail
  shelves including Target, supported by a store locator, wholesale program, and
  an Instagram/TikTok community. It was surfaced as a portfolio company of
  ggv-capital and added to the API Evangelist network. As a consumer packaged
  goods brand it exposes an ecommerce storefront and customer-account surface
  rather than a public developer API.
